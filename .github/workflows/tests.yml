# Clean install + run the builder test suite across supported Node versions.
# The app/engine/bookmarklet are browser code exercised by the manual browser
# gates; CI covers the Node-side builder (`wiki-search-index`).
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Node.js ${{matrix.node-version}} on ubuntu-latest
    permissions:
      contents: read
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{matrix.node-version}}
      - run: |
          npm ci
          npm test
